# ---------------------------------------------------------------- Trends (tags from TrendCard.tag)

- tag: detention
  pain: Trucks wait at the dock for hours and the detention never gets billed
  hemut_feature: Detention flagged while the truck waits, with dock time ready to bill
  claim_ids: [hemi-desk-detention]
  audiences: [dispatcher, fleet-owner]
- tag: check-call-overload
  pain: Dispatchers spend the day on check calls and status emails
  hemut_feature: Customers updated before they call, and an agent for the calls that remain
  claim_ids: [hemi-desk-check-calls-tracking, voice-agent-does]
  audiences: [dispatcher]
# Only product-hemut-diesel backs fuel, so one angle; its claim publishes no discount amount.
- tag: diesel-prices
  pain: Fuel eats into every load when diesel prices climb
  hemut_feature: Hemut Diesel, a fuel card with fleet discounts and nationwide coverage
  claim_ids: [product-hemut-diesel]
  audiences: [fleet-owner]
# Collections and short-pay surfacing only: Hemut makes no fraud-prevention claim.
- tag: short-pays-collections
  pain: Short pays and deductions go unnoticed until the money is gone
  hemut_feature: Overdue invoices chased, with short pays and deductions surfaced
  claim_ids: [hemi-desk-payments-collections]
  audiences: [back-office, fleet-owner]
- tag: short-pays-collections
  pain: Invoices go out late because the POD never came back
  hemut_feature: PODs chased until they are in, and delivered loads become invoices
  claim_ids: [hemi-desk-pod-paperwork, hemi-desk-billing]
  audiences: [back-office]
- tag: peak-season
  pain: Peak volume buries the office in check calls and status emails
  hemut_feature: Customers warned before a load runs late, and a voice agent for the calls that remain
  claim_ids: [hemi-desk-check-calls-tracking, voice-agent-does]
  audiences: [dispatcher]
- tag: peak-season
  pain: More loads means more PODs to chase and more invoices to send
  hemut_feature: PODs chased until they are in, and delivered loads become invoices
  claim_ids: [hemi-desk-pod-paperwork, hemi-desk-billing]
  audiences: [back-office]
- tag: tight-capacity
  pain: Every truck counts and the wrong assignment costs a load
  hemut_feature: On Command Pro, drivers ranked for each load with hours of service in view
  claim_ids: [hemi-desk-dispatch, feature-driver-ranking, feature-hos-at-assignment]
  audiences: [dispatcher, fleet-owner]
- tag: expiring-documents
  pain: A medical card or permit lapses and nobody noticed
  hemut_feature: Expiring documents turn into a renewal task before they lapse
  claim_ids: [feature-compliance-expiry, hemi-desk-pod-paperwork]
  audiences: [back-office, fleet-owner]
- tag: empty-miles
  pain: Trucks sit or run empty waiting for the next load
  hemut_feature: On Command Pro, backhauls found before a truck sits
  claim_ids: [hemi-desk-dispatch]
  audiences: [dispatcher, fleet-owner]

# ---------------------------------------------------------------- Evergreen pillars

- tag: evergreen-pricing
  pain: Not knowing what a TMS costs until after a demo and a quote
  hemut_feature: Every self-serve price is published, with a free trial and no card
  claim_ids: [prices-published, command-base-price, trial-days]
  audiences: [fleet-owner]
- tag: evergreen-rate-cons
  pain: Someone in the office retypes every rate confirmation into the TMS
  hemut_feature: Rate confirmations that arrive by email become loads
  claim_ids: [feature-rate-cons-from-email, hemi-desk-inbox-rate-cons]
  audiences: [back-office, dispatcher, fleet-owner]
- tag: evergreen-switching
  pain: Switching TMS sounds like months of setup and a risky cutover
  hemut_feature: Self-serve setup, dispatching the same afternoon, able to run beside the old TMS
  claim_ids: [setup-same-afternoon, setup-what-comes-across, feature-beside-legacy-tms]
  audiences: [fleet-owner]
