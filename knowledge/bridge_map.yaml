# The only way a season or trend becomes a Brief: tag -> pain -> Hemut feature -> claim ids. No bridge, no Brief.
# Loaded into schemas.BridgeEntry by knowledge/loader.py. Every claim id must exist in claims.yaml (tested).
# tag is a season id (seasonality.yaml), a trend tag (TrendCard.tag), or "evergreen-<pillar>".
# Two entries for one tag are two angles: the planner rotates them week to week.
# pain is a Brief field the draft model reads, so it states no facts, dates or numbers of its own.

# ---------------------------------------------------------------- Seasons
# The four IFTA quarters share the same two angles.

- tag: ifta-q1
  pain: The office rebuilds the IFTA return by hand from miles and fuel receipts every quarter
  hemut_feature: IFTA quarters built from the miles and fuel already in Command
  claim_ids: [hemi-desk-settlements-ifta, feature-back-office-in-plans, ifta-q1-due]
- tag: ifta-q1
  pain: Paying for a separate IFTA tool and keying the same miles in again
  hemut_feature: IFTA quarterly reports are part of every Command plan
  claim_ids: [feature-back-office-in-plans, command-base-price, ifta-q1-due]
