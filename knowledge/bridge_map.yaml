- tag: winter-weather
  pain: Weather delays push loads late and customers call the office for updates
  hemut_feature: Customers warned before a load runs late, with live ETAs
  claim_ids: [hemi-desk-check-calls-tracking, feature-tracking]
- tag: winter-weather
  pain: Replanning loads after a weather delay without running drivers out of hours
  hemut_feature: Hours of service shown on the dispatch board when a load is assigned
  claim_ids: [feature-hos-at-assignment, feature-dispatch-board]

# ---------------------------------------------------------------- Trends (tags from TrendCard.tag)

- tag: detention
  pain: Trucks wait at the dock for hours and the detention never gets billed
  hemut_feature: Detention flagged while the truck waits, with dock time ready to bill
  claim_ids: [hemi-desk-detention]
- tag: check-call-overload
  pain: Dispatchers spend the day on check calls and status emails
  hemut_feature: Customers updated before they call, and an agent for the calls that remain
  claim_ids: [hemi-desk-check-calls-tracking, voice-agent-does]

# ---------------------------------------------------------------- Evergreen pillars

- tag: evergreen-pricing
  pain: Not knowing what a TMS costs until after a demo and a quote
  hemut_feature: Every self-serve price is published, with a free trial and no card
  claim_ids: [prices-published, command-base-price, trial-days]
- tag: evergreen-rate-cons
  pain: Someone in the office retypes every rate confirmation into the TMS
  hemut_feature: Rate confirmations that arrive by email become loads
  claim_ids: [feature-rate-cons-from-email, hemi-desk-inbox-rate-cons]
- tag: evergreen-switching
  pain: Switching TMS sounds like months of setup and a risky cutover
  hemut_feature: Self-serve setup, dispatching the same afternoon, able to run beside the old TMS
  claim_ids: [setup-same-afternoon, setup-what-comes-across, feature-beside-legacy-tms]
