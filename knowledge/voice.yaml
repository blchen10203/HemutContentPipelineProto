# Voice rules for all generated copy. Loaded by knowledge/loader.py into schemas.VoiceRules.

allowed_product_names: [Command, Control, Hemi, Forge, Custom, Hemut Diesel]
retired_names: [Core, Reach]

# Never named in copy: other TMS vendors and their products. Matched case-sensitively as whole words.
# Competitor claims in claims.yaml are background for the writer; each one names a company listed here.
competitor_names:
  [McLeod, RespondAI, PCS, Cortex, Backhaul Booster, Trimble, TMW, TruckMate, Arc Agent, Alvys, Foundry, LoadStop,
   Vooma, Everest, Drumkit, Rose Rocket, AscendTMS, Tailwind TMS, Turvo, MercuryGate, Truckbase, Aljex, ProTransport]

# PROPOSED, NEEDS BRYAN'S SIGN-OFF: banned_words and vocabulary below.
# banned_words holds only claims that are absolute, or false or deceptive in an ad (FTC Act section 5:
# claims need substantiation; FTC "Free" guide, 16 CFR 251). Style is not policed here.
# Matched case-insensitively as phrases; none appear in any claims.yaml phrasing.
banned_words:
  # Absolute promises of results
  - guarantee
  - "100%"
  - risk-free
  - no risk
  - error-free
  - zero errors
  - eliminate all
  - pays for itself
  - double your
  - triple your
  - 10x
  - instant results
  - always on time
  - proven to
  - proven results
  # Superlatives and exclusivity Hemut cannot substantiate (no ranking or customer count is published)
  - "#1"
  - number one
  - industry-leading
  - market leader
  - the only
  - lowest price
  - cheapest
  # False offer terms: there is no free tier, and agents have monthly allowances
  - free forever
  - free plan
  - free account
  - unlimited
  # False government endorsement
  - FMCSA approved
  - FMCSA certified
  - DOT approved
  - DOT certified
  - government approved
  - audit-proof

# Operator words the source uses for the job itself. Prefer these over generic software terms.
vocabulary:
  - carrier
  - asset-based carrier
  - fleet
  - truck
  - tractor
  - trailer
  - load
  - lane
  - dispatch
  - dispatcher
  - the office
  - desk
  - back office
  - rate con
  - rate confirmation
  - check call
  - POD
  - backhaul
  - detention
  - dock
  - hours of service
  - ELD
  - driver pay
  - settlement
  - factoring
  - short pay
  - IFTA
  - DVIR
  - USDOT number
  - FMCSA
  - EDI
  - TMS
