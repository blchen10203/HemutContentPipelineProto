  verified_by: Bryan Chen

- id: ifta-q4
  name: IFTA Q4 return (October-December)
  start: "01-01"
  end: "01-31"
  lead_days: 7
  source_url: https://www.iftach.org/Carriers/
  checked: 2026-10-24
  verified_by: Bryan Chen

# NOAA: "meteorological winter includes December, January, and February." 02-28 also covers leap years but one day.
- id: winter-weather
  name: Winter weather (meteorological winter)
  start: "12-01"
  end: "02-28"
  lead_days: 14
  source_url: https://www.ncei.noaa.gov/news/meteorological-versus-astronomical-seasons
  checked: 2026-10-24
  verified_by: Bryan Chen

# NHC: "The official hurricane season for the Atlantic basin is from June 1 to November 30" (knowledge/sources/nhc-climo_2026-10-26.txt).
- id: hurricane-season
  name: Atlantic hurricane season
  start: "06-01"
  end: "11-30"
  lead_days: 7
  source_url: https://www.nhc.noaa.gov/climo/
  checked: 2026-10-26
  verified_by: Bryan Chen
