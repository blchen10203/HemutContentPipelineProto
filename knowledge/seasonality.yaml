# Recurring windows that boost a matching Hemut topic. Loaded into schemas.SeasonWindow by knowledge/loader.py.
# A window is active from (start - lead_days) through end; start after end means it wraps past Dec 31.
# Every date here comes from the source_url page. verified_by stays null until a human checks it.
#
# Left out because no official page gives a recurring date (2026-10-24):
# - UCR renewal: plan.ucr.gov says the 2027 portal opens October 1, 2026, but no official page fetched states the deadline
#   (plan.ucr.gov answered 403 on 2026-10-26).
# - CVSA International Roadcheck, Operation Safe Driver Week, Brake Safety Week: dates are set each year, not fixed.
# - Peak season, produce season: no official source defines the dates.
# Left out (2026-10-26), from research/hemut_market_brief_2026-10.md section 5:
# - Form 2290 (heavy vehicle use tax): the IRS pages fetched state no due date, and no claim backs a bridge for it.
# - MATS, Manifest, TIA Capital Ideas, ATRI Top Issues: events whose dates are set each year.
# - Eastern Pacific hurricane season (May 15): only the Atlantic window is used.

# IFTA: quarterly filing calendar on the source page: April 30, July 31, October 31, January 31 of the following year.
# "When the due date falls on a weekend or legal holiday, the next business day applies." (Oct 31, 2026 is a Saturday.)
# The window is that filing month; lead_days starts it in the last week of the quarter, while receipts can still be gathered.
- id: ifta-q1
  name: IFTA Q1 return (January-March)
  start: "04-01"
  end: "04-30"
  lead_days: 7
  source_url: https://www.iftach.org/Carriers/
  checked: 2026-10-24
  verified_by: Bryan Chen

- id: ifta-q2
  name: IFTA Q2 return (April-June)
  start: "07-01"
  end: "07-31"
  lead_days: 7
  source_url: https://www.iftach.org/Carriers/
  checked: 2026-10-24
  verified_by: Chelsey Sheng

- id: ifta-q3
  name: IFTA Q3 return (July-September)
  start: "10-01"
  end: "10-31"
  lead_days: 7
  source_url: https://www.iftach.org/Carriers/
