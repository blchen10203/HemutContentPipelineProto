# Every fact allowed in copy. Built only from the snapshots in knowledge/sources/ (2026-10-23).
# Loaded and checked by knowledge/loader.py into schemas.Claim.
#
# Rules for this file:
# - One entry per number or product claim. `context` holds qualifiers that must travel with the claim.
# - `phrasings` are the only wordings allowed in copy. None of them drop a qualifier.
# - requires_approval: true for ROI metrics, competitor facts, and customer names/quotes until a human signs off.
#   Approved 2026-10-27 by Chelsey Sheng ("Hemut Claim Approvals" PDF, all 51 marked True): every customer, ROI,
#   competitor and conflict entry below that was gated, now requires_approval: false.
# - Where sources disagree, both entries are kept and marked "# CONFLICT:". Nothing is resolved here
#   unless a human approval says so (noted on the entry).
# - llms-full says the pricing page wins on disagreement, so price facts cite the pricing page where it states them.

