# The product features an ad can sell, each with the screenshots that show it. A bridge_map.yaml entry names one by id.
# Listing a screenshot here means a human reviewed that image. Screenshots must show demo data only: no real customer,
# driver, load or company names. on_screen describes the screen in words with no numbers, quotes or dates.
# Image files live in assets/screenshots/ (local only, gitignored); a listed file that is missing is skipped.
# label is unique: the app's dropdown maps it back to the id.

- id: ifta
  label: IFTA quarterly reports
  hemut_feature: IFTA quarters built from the miles and fuel already in Command
  claim_ids: [hemi-desk-settlements-ifta, feature-back-office-in-plans]
  screenshots: []
- id: live-tracking
  label: Live tracking and late-load warnings
  hemut_feature: Customers warned before a load runs late, with live ETAs
  claim_ids: [hemi-desk-check-calls-tracking, feature-tracking]
  screenshots: []
